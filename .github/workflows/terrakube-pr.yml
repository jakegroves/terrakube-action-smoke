name: Terrakube PR plan
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  pull-requests: write
  id-token: write
concurrency:
  group: terrakube-local-smoke
  cancel-in-progress: false
jobs:
  plan:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'jakegroves'
    runs-on: [self-hosted, terrakube-dev]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Check GitHub OIDC access
        shell: bash
        run: |
          node <<'NODE'
          const https = require('node:https');
          const url = process.env.ACTIONS_ID_TOKEN_REQUEST_URL;
          const token = process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN;
          if (!url || !token) {
            console.error(`OIDC settings present: URL=${Boolean(url)}, token=${Boolean(token)}`);
            process.exitCode = 1;
          } else {
            const target = new URL(url);
            target.searchParams.set('audience', 'api://terrakube-local');
            const request = https.get(target, {headers: {Authorization: `Bearer ${token}`}}, response => {
              console.log(`GitHub OIDC HTTP status: ${response.statusCode}`);
              response.resume();
              if (response.statusCode !== 200) process.exitCode = 1;
            });
            request.setTimeout(15000, () => request.destroy(new Error('OIDC request timed out')));
            request.on('error', error => {
              console.error(`OIDC request failed: ${error.code || error.name}`);
              process.exitCode = 1;
            });
          }
          NODE
      - uses: terrakube-io/terrakube-action-github@d20ae6d01701e32ff6c1c9ae314012d076ddaecf
        id: terrakube
        with:
          TERRAKUBE_ENDPOINT: https://terrakube-api.localhost
          TERRAKUBE_UI_URL: https://terrakube.localhost
          TERRAKUBE_ORGANIZATION: simple
          TERRAKUBE_TEMPLATE: Plan
          TERRAKUBE_AUTH: oidc
          TERRAKUBE_OIDC_AUDIENCE: api://terrakube-local
          TERRAKUBE_ROOT: infra/smoke
          TERRAKUBE_WORKSPACE: action-smoke
          TERRAKUBE_BRANCH: ${{ github.head_ref }}
          TERRAKUBE_COMMIT: ${{ github.event.pull_request.head.sha }}
          COMMENT_MODE: summary
          TIMEOUT_SECONDS: '300'
      - name: Show results
        if: always()
        env:
          STATUS: ${{ steps.terrakube.outputs.STATUS }}
          JOBS: ${{ steps.terrakube.outputs.JOBS }}
        shell: bash
        run: |
          printf 'Status: %s\n' "$STATUS"
          printf 'Jobs: %s\n' "$JOBS"
