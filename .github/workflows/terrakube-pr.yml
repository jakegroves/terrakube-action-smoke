name: Module OIDC PR feedback
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
  pull-requests: write
  id-token: write
concurrency:
  group: terrakube-module-validation
  cancel-in-progress: false
jobs:
  plan:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, terrakube-dev]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: terrakube-io/terrakube-action-github@f4ad636431fc9340efd7fbd023e198b87cbda5ec
        with:
          TERRAKUBE_ENDPOINT: https://terrakube-api.localhost
          TERRAKUBE_UI_URL: https://terrakube.localhost
          TERRAKUBE_ORGANIZATION: simple
          TERRAKUBE_WORKSPACE: oidc-module-selected
          TERRAKUBE_ROOT: infra/smoke
          TERRAKUBE_TEMPLATE: OIDC module validation plan
          TERRAKUBE_OPERATION: run
          TERRAKUBE_AUTH: oidc
          TERRAKUBE_OIDC_AUDIENCE: api://module-validation
          TERRAKUBE_BRANCH: ${{ github.head_ref }}
          TERRAKUBE_COMMIT: ${{ github.event.pull_request.head.sha }}
          COMMENT_MODE: summary
          TIMEOUT_SECONDS: '450'
